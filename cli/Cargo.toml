[package]
name = "soroban-cost-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI profiler for Soroban smart contracts — measures per-function resource cost across five dimensions and reports against mainnet limits."
readme = "../README.md"
keywords = ["soroban", "stellar", "smart-contracts", "profiler", "cost"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "soroban-cost-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
owo-colors = "4"
