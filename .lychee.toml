# Config for the lychee link checker used by .github/workflows/docs-link-check.yml
# See https://lychee.cli.rs/#/usage/config

# Don't fail the build on links that are just slow/flaky, retry them first.
max_retries = 3
retry_wait_time = 5

# Some sites block CI runners' user agents; identify as a normal browser to reduce false positives.
user_agent = "Mozilla/5.0 (compatible; lychee/docs-link-check)"

# Anchors (#section) aren't always reliably checkable on rendered GitHub markdown; skip fragment checks.
include_fragments = false

exclude = [
    # Localhost / placeholder examples used in docs, not real endpoints.
    "^http://localhost",
    "^https://example\\.com",
]

# GitHub's own links can rate-limit unauthenticated requests; the workflow passes GITHUB_TOKEN to help with this.
