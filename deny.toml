# Config for `cargo deny check`. See https://embarkstudios.github.io/cargo-deny/
# Run `cargo deny check` locally before committing changes here.

[graph]
all-features = true

[advisories]
# Deny known-vulnerable crates (RUSTSEC advisories); yanked crates get a warning.
version = 2
yanked = "warn"
ignore = [
    # `derivative` is unmaintained but is a transitive dep of ark-* crates
    # used by soroban-env-host; no safe upgrade path available.
    "RUSTSEC-2024-0388",
    # `paste` is unmaintained but is a transitive dep of ark-ff and soroban-wasmi;
    # no safe upgrade path available.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Allow common permissive licenses used across the Rust/Soroban ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = [
    # Add specific crates to ban here if needed, e.g.:
    # { name = "openssl", reason = "use rustls instead" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
