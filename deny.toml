# Config for `cargo deny check`. See https://embarkstudios.github.io/cargo-deny/
# Run `cargo deny check` locally before committing changes here.

[graph]
all-features = true

[advisories]
# Deny known-vulnerable crates (RUSTSEC advisories); yanked crates get a warning.
version = 2
yanked = "warn"
ignore = [
    # Add advisory IDs here with a comment explaining why, e.g.:
    # "RUSTSEC-2023-0001", # not exploitable in our usage, see issue #NN
]

[licenses]
version = 2
# Allow common permissive licenses used across the Rust/Soroban ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = [
    # Add specific crates to ban here if needed, e.g.:
    # { name = "openssl", reason = "use rustls instead" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
