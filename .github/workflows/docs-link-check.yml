name: Docs Link Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-link-check.yml'
      - '.lychee.toml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-link-check.yml'
      - '.lychee.toml'
  schedule:
    # Weekly, catches links that rotted with no doc changes (e.g. moved upstream pages)
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  link-check:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            README.md
            CONTRIBUTING.md
            SECURITY.md
            RELEASING.md
            CHANGELOG.md
            "docs/**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
